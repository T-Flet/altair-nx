[build-system]
requires = ['hatchling', 'hatch-vcs']
build-backend = 'hatchling.build'


[project]
name = 'altair-nx'
authors = [
  { name = 'Thomas Fletcher', email = 'T-Fletcher@outlook.com' },
  { name = 'Zach Sailer', email = 'zachsailer@gmail.com' },
]
description = 'Draw interactive NetworkX graphs with Altair'
readme = 'README.md'
license.file = 'LICENSE'
requires-python = '>=3.12'
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Operating System :: OS Independent',
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Topic :: Scientific/Engineering',
  'Typing :: Typed',
]
dynamic = ['version']
dependencies = [
  'altair>=6',
  'networkx>=3.7',
  'pandas>=3'
]

[dependency-groups]
test = [
  'pytest>=8',
  'pytest-cov>=5',
  'scipy>=1.14', # the default for stitch_frames' positions (a union-graph kamada_kawai_layout) requires it; kept on the test group since only tests exercise the library's default layout
]
dev = [
  { include-group = 'test' },
  "ipykernel>=7.4.0",
]
docs = [
  'sphinx>=7.0',
  'myst_parser>=0.13',
  'sphinx_copybutton',
  'sphinx_autodoc_typehints',
  'furo>=2023.08.17',
]
examples = [
    "matplotlib>=3.11.2",
    "vl-convert-python>=1.9",
]

[project.urls]
Homepage = 'https://github.com/T-Flet/altair-nx'
Documentation = 'https://altair-nx.readthedocs.io/en/stable'
'Bug Tracker' = 'https://github.com/T-Flet/altair-nx/issues'
Discussions = 'https://github.com/T-Flet/altair-nx/discussions'
Changelog = 'https://github.com/T-Flet/altair-nx/releases'


[tool.hatch]
version.source = 'vcs'
build.hooks.vcs.version-file = 'src/altair_nx/_version.py'


[tool.pytest.ini_options]
minversion = '8.0'
addopts = ['-ra', '--showlocals', '--strict-markers', '--strict-config']
xfail_strict = true
filterwarnings = [
  'error',
]
log_cli_level = 'INFO'
testpaths = [
  'tests',
]


[tool.coverage]
run.source = ['altair_nx']
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ['src', 'tests']
python_version = '3.12'
warn_unused_configs = true
strict = true
enable_error_code = ['ignore-without-code', 'truthy-bool']
warn_unreachable = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = 'altair_nx.*'
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ['altair', 'altair.*', 'networkx', 'networkx.*', 'pandas', 'pandas.*', 'numpy', 'numpy.*']
ignore_missing_imports = true


[tool.ruff]
src = ['src']

[tool.ruff.lint]
extend-select = [
  'B',        # flake8-bugbear
  'RUF013',   # explicit Optional
  'T20',      # flake8-print
  'NPY',      # NumPy specific rules
  'PD',       # pandas-vet
  'PGH',      # pygrep-hooks
]
ignore = [
  'PLR09',    # Too many <...>
  'PLR2004',  # Magic value used in comparison
  'ISC001',   # Conflicts with formatter
]


[tool.ruff.lint.per-file-ignores]
'tests/**' = ['T20']
'noxfile.py' = ['T20']


[tool.pylint]
py-version = '3.12'
ignore-paths = ['.*/_version.py']
reports.output-format = 'colorized'
similarities.ignore-imports = 'yes'
messages_control.disable = [
  'design',
  'fixme',
  'line-too-long',
  'missing-module-docstring',
  'missing-function-docstring',
  'wrong-import-position',
]
